<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SyncBoard — Replay</title>
<link rel="stylesheet" href="/css/theme.css" />
<link rel="stylesheet" href="/css/room.css" />
<link rel="stylesheet" href="/css/replay.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"></span>SyncBoard</div>
      <div class="room-code mono"><span id="roomCodeText">------</span></div>
      <span class="replay-badge">REPLAY</span>
      <a class="ghost-btn" id="backLink" href="#">Back to room</a>
      <div style="flex:1"></div>
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme" aria-pressed="false">
        <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="12" y1="1.5" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22.5" y2="12"/><line x1="4.4" y1="4.4" x2="6.5" y2="6.5"/><line x1="17.5" y1="17.5" x2="19.6" y2="19.6"/><line x1="4.4" y1="19.6" x2="6.5" y2="17.5"/><line x1="17.5" y1="6.5" x2="19.6" y2="4.4"/></g></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M20.5 14.9A8.6 8.6 0 1 1 9.1 3.5a7 7 0 0 0 11.4 11.4Z"/></svg>
      </button>
    </header>

    <main class="workspace">
      <section class="pane code-pane" id="codePane">
        <div class="pane-head">
          <span class="pane-title">main.py</span>
          <span class="pane-sub mono" id="codeCount">0 chars</span>
        </div>
        <div class="editor-wrap">
          <pre class="editor-highlight" aria-hidden="true"><code id="highlightEl"></code></pre>
          <textarea id="codeTextarea" class="editor-input mono" spellcheck="false" readonly></textarea>
        </div>
      </section>
      <div class="divider" id="divider"></div>
      <section class="pane board-pane">
        <div class="pane-head"><span class="pane-title">Whiteboard</span></div>
        <div class="board-wrap" id="boardWrap"></div>
      </section>

      <aside class="summary" id="summaryPanel">
        <h2>Session summary</h2>
        <div class="summary-stat">
          <span class="summary-label">Duration</span>
          <span class="summary-value" id="statDuration">—</span>
        </div>
        <div class="summary-stat">
          <span class="summary-label">Time to first code</span>
          <span class="summary-value" id="statFirstCode">—</span>
        </div>
        <div class="summary-stat">
          <span class="summary-label">Long pauses</span>
          <span class="summary-value" id="statPauses">—</span>
        </div>
        <div class="summary-stat">
          <span class="summary-label">Thrash moments</span>
          <span class="summary-value" id="statThrash">—</span>
        </div>
        <div class="summary-stat">
          <span class="summary-label">Total events</span>
          <span class="summary-value" id="statEvents">—</span>
        </div>
        <p class="summary-hint">Markers on the timeline below show where pauses (amber) and rapid rewrites (rose) happened — scrub to jump straight there.</p>
      </aside>
    </main>

    <footer class="transport">
      <button class="transport-btn" id="playBtn" aria-label="Play">
        <svg id="playIcon" width="15" height="15" viewBox="0 0 24 24"><path d="M6 4l15 8-15 8V4z" fill="currentColor"/></svg>
        <svg id="pauseIcon" width="15" height="15" viewBox="0 0 24 24" style="display:none"><rect x="5" y="4" width="5" height="16" fill="currentColor"/><rect x="14" y="4" width="5" height="16" fill="currentColor"/></svg>
      </button>
      <span class="mono time-label" id="timeLabel">0:00 / 0:00</span>
      <div class="scrub-wrap">
        <svg id="densitySvg" class="density" viewBox="0 0 1000 34" preserveAspectRatio="none"></svg>
        <input type="range" id="scrubRange" min="0" max="1000" value="0" />
      </div>
      <div class="speed-group" id="speedGroup">
        <button data-speed="0.5">0.5×</button>
        <button data-speed="1" class="active">1×</button>
        <button data-speed="2">2×</button>
        <button data-speed="4">4×</button>
        <button data-speed="8">8×</button>
      </div>
    </footer>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/rga.js"></script>
  <script src="/js/lexer.js"></script>
  <script src="/js/canvas-board.js"></script>
  <script src="/js/codepad.js"></script>
  <script src="/js/replay.js"></script>
</body>
</html>
